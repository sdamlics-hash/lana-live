name: LANA V3.7 Native Workspace
on:
  pull_request:
    paths:
      - 'android_workspace/**'
      - '.github/workflows/lana-v37-workspace.yml'
      - '.github/scripts/lana-v37-workspace-smoke.py'
  workflow_dispatch:
jobs:
  build-and-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate native workspace from preserved V3.3 archive
        run: |
          python -m unittest discover -s android_workspace/tests -v
          python android_workspace/patch_v37.py LANA_V3_3_ANDROID_APP_SOURCE.zip /tmp/lana-v37
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Native Kotlin tests and APK
        run: |
          cd /tmp/lana-v37
          gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real task and memory persistence on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python .github/scripts/lana-v37-workspace-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: LANA-V3.7-WORKSPACE-APK
          path: /tmp/lana-v37/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
