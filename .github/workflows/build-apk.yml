name: Build LANA V3.3 APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack LANA V3.3
        run: unzip -o LANA_V3_3_ANDROID_APP_SOURCE.zip -d source

      - name: Inspect existing Android app source
        run: |
          echo '=== AndroidManifest.xml ==='
          cat source/app/src/main/AndroidManifest.xml
          echo '=== MainActivity.kt ==='
          cat source/app/src/main/java/ai/dreibus/lanalive/MainActivity.kt
          echo '=== activity_main.xml ==='
          cat source/app/src/main/res/layout/activity_main.xml
          echo '=== app/build.gradle.kts ==='
          cat source/app/build.gradle.kts

      - name: Configure Android build
        run: |
          echo "android.useAndroidX=true" > source/gradle.properties
          sed -i '/compileSdk = 35/a\    kotlinOptions { jvmTarget = "1.8" }' source/app/build.gradle.kts
          # Parallel preview install: avoid overwriting an app signed with another key.
          sed -i 's/applicationId = "ai.dreibus.lanalive"/applicationId = "ai.dreibus.lanalive.preview"/' source/app/build.gradle.kts
          sed -i 's/android:label="LANA LIVE"/android:label="LANA TEST"/' source/app/src/main/AndroidManifest.xml

      - name: Fix Russian voice replies and show TTS diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app/src/main/java/ai/dreibus/lanalive/MainActivity.kt")
          s = p.read_text()
          old = 'if (words.contains("лана", ignoreCase = true)) {'
          new = 'if (words.isNotBlank()) { // Voice test: reply to every recognized phrase, including misheard wake words'
          assert old in s
          s = s.replace(old, new)
          old = 'if (!ttsReady) {\n                            status.text = "Голос пока не готов: проверьте русский голос Android"\n                            retryVoice()'
          new = 'if (!ttsReady) {\n                            status.text = "Текст распознан, но русский TTS не готов. Проверьте голосовой движок Android."\n                            retryVoice()'
          assert old in s
          s = s.replace(old, new)
          old = 'if (result != TextToSpeech.SUCCESS) {\n                                speaking = false\n                                retryVoice()'
          new = 'if (result != TextToSpeech.SUCCESS) {\n                                speaking = false\n                                status.text = "Ошибка воспроизведения TTS: код " + result\n                                retryVoice()'
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: cd source && gradle --no-daemon assembleDebug

      - name: Inspect APK and record checksum
        run: |
          set -euo pipefail
          APK=source/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p diagnostics
          sha256sum "$APK" > diagnostics/apk-sha256.txt
          ls -lh "$APK" > diagnostics/apk-file-size.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" > diagnostics/apk-signing-certificate.txt
          "$AAPT" dump badging "$APK" | grep '^package:' > diagnostics/apk-package-version.txt
          cat diagnostics/apk-signing-certificate.txt
          cat diagnostics/apk-package-version.txt
          echo "APK built successfully; install on a device is not tested by this workflow."

      - name: Upload APK diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: LANA-V3.3-APK-diagnostics
          path: diagnostics/
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LANA-TEST-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
