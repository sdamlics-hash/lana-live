name: Build LANA V3.3 APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack LANA V3.3
        run: unzip -o LANA_V3_3_ANDROID_APP_SOURCE.zip -d source

      - name: Inspect existing Android app source
        run: |
          echo '=== AndroidManifest.xml ==='
          cat source/app/src/main/AndroidManifest.xml
          echo '=== MainActivity.kt ==='
          cat source/app/src/main/java/ai/dreibus/lanalive/MainActivity.kt
          echo '=== activity_main.xml ==='
          cat source/app/src/main/res/layout/activity_main.xml
          echo '=== app/build.gradle.kts ==='
          cat source/app/build.gradle.kts

      - name: Configure Android build
        run: |
          echo "android.useAndroidX=true" > source/gradle.properties
          sed -i '/compileSdk = 35/a\    kotlinOptions { jvmTarget = "1.8" }' source/app/build.gradle.kts
          # Parallel preview install: avoid overwriting an app signed with another key.
          sed -i 's/applicationId = "ai.dreibus.lanalive"/applicationId = "ai.dreibus.lanalive.preview3"/' source/app/build.gradle.kts
          sed -i 's/android:label="LANA LIVE"/android:label="LANA TEST 3"/' source/app/src/main/AndroidManifest.xml

      - name: Fix Russian voice replies and show TTS diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app/src/main/java/ai/dreibus/lanalive/MainActivity.kt")
          s = p.read_text()
          old = 'if (words.contains("лана", ignoreCase = true)) {'
          new = 'if (words.isNotBlank()) { // Voice test: reply to every recognized phrase, including misheard wake words'
          assert old in s
          s = s.replace(old, new)
          old = 'if (!ttsReady) {\n                            status.text = "Голос пока не готов: проверьте русский голос Android"\n                            retryVoice()'
          new = 'if (!ttsReady) {\n                            status.text = "Текст распознан, но русский TTS не готов. Проверьте голосовой движок Android."\n                            retryVoice()'
          assert old in s
          s = s.replace(old, new)
          old = 'if (result != TextToSpeech.SUCCESS) {\n                                speaking = false\n                                retryVoice()'
          new = 'if (result != TextToSpeech.SUCCESS) {\n                                speaking = false\n                                status.text = "Ошибка воспроизведения TTS: код " + result\n                                retryVoice()'
          assert old in s
          s = s.replace(old, new)
          # Visible build marker plus a manual TTS test on a long press of the green button.
          s = s.replace('renderHistory()\n        tts = TextToSpeech(this)', 'renderHistory()\n        status.text = "LANA TEST 3: готова к проверке речи"\n        tts = TextToSpeech(this)', 1)
          needle = 'findViewById<Button>(R.id.voiceButton).setOnClickListener {'
          assert needle in s
          s = s.replace(needle, """findViewById<Button>(R.id.voiceButton).setOnLongClickListener {
              val phrase = "Привет! Это Лана. Проверка моего голоса."
              appendHistory("Лана TEST 3: " + phrase)
              if (ttsReady) {
                  val code = tts?.speak(phrase, TextToSpeech.QUEUE_FLUSH, null, "lana_manual_test")
                  status.text = if (code == TextToSpeech.SUCCESS) "TEST 3: запрос голоса отправлен" else "TEST 3: ошибка TTS " + code
              } else status.text = "TEST 3: TTS не готов, проверь русский голос Android"
              true
          }
          """ + needle, 1)
          p.write_text(s)
          PY

      - name: Connect Android voice to LANA AI backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path("source/app/src/main/java/ai/dreibus/lanalive/LanaConnectedActivity.kt")
          src.write_text(Path("android/LanaConnectedActivity.kt").read_text())
          manifest = Path("source/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          if 'android.permission.INTERNET' not in m:
              m = m.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\\n    <application', 1)
          if 'android.permission.RECORD_AUDIO' not in m:
              m = m.replace('<application', '<uses-permission android:name="android.permission.RECORD_AUDIO" />\\n    <application', 1)
          m, count = re.subn(r'android:name="[.]MainActivity"', 'android:name=".LanaConnectedActivity"', m, count=1)
          assert count == 1, "MainActivity launcher declaration not found; refusing to build a disconnected app"
          manifest.write_text(m)
          print("Connected voice activity installed; manifest and permissions updated")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # A persistent signing certificate is required for Android in-place updates.
      # Configure LANA_ANDROID_DEBUG_KEYSTORE_B64 in repository Actions secrets.
      # Never commit the keystore or its passwords to the repository.
      - name: Restore stable Android signing key
        env:
          LANA_KEYSTORE_B64: ${{ secrets.LANA_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$LANA_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$LANA_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Stable signing certificate restored from GitHub Actions secret."
          else
            echo "::warning::No stable signing certificate configured. APK cannot update a prior CI build in place."
          fi

      - name: Build APK
        run: cd source && gradle --no-daemon assembleDebug

      - name: Inspect APK and record checksum
        run: |
          set -euo pipefail
          APK=source/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p diagnostics
          sha256sum "$APK" > diagnostics/apk-sha256.txt
          ls -lh "$APK" > diagnostics/apk-file-size.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" > diagnostics/apk-signing-certificate.txt
          "$AAPT" dump badging "$APK" | grep '^package:' > diagnostics/apk-package-version.txt
          cat diagnostics/apk-signing-certificate.txt
          cat diagnostics/apk-package-version.txt
          echo "APK built successfully; install on a device is not tested by this workflow."

      - name: Upload APK diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: LANA-V3.3-APK-diagnostics
          path: diagnostics/
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LANA-TEST-3-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install fastapi openai httpx pytest
      - name: Run LANA backend tests
        run: python -m pytest -q backend/test_lana_api.py
