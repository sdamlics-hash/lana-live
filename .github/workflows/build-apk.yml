name: Build LANA LIVE V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o LANA_LIVE_GITHUB_READY_V2.zip -d source

      - name: Configure Android build
        run: |
          echo "android.useAndroidX=true" > source/gradle.properties
          sed -i '/compileSdk = 35/a\    kotlinOptions { jvmTarget = "1.8" }' source/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: cd source && gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LANA-LIVE-V2-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
