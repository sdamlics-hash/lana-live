name: LANA Local Model Compatibility
on:
  push:
    branches: ['work/lana-1048-local-model-20261125']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate offline candidate and add pinned runtime
        run: python android_local_model/prepare_probe.py /tmp/lana-local-model dependency
      - name: Resolve dependency and compile baseline
        working-directory: /tmp/lana-local-model
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Add on-device CPU inference API probe
        run: python android_local_model/prepare_probe.py /tmp/lana-local-model api
      - name: Compile local model API and regressions
        working-directory: /tmp/lana-local-model
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Check APK permissions
        run: |
          set -euo pipefail
          APK=$(find /tmp/lana-local-model/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$APK" && test -n "$AAPT"
          "$AAPT" dump permissions "$APK" | tee /tmp/lana-local-model-permissions.txt
          if grep -Fq android.permission.INTERNET /tmp/lana-local-model-permissions.txt; then exit 1; fi
