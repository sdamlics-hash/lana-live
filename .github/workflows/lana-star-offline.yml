name: LANA Star Offline Candidate
on:
  push:
    branches: ['work/lana-1048-star-offline-20261125']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate star offline candidate
        run: python android_star/prepare_star.py /tmp/lana-star
      - name: Test and compile Android renderer
        working-directory: /tmp/lana-star
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Check offline APK permissions
        run: |
          set -euo pipefail
          APK=$(find /tmp/lana-star/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$APK" && test -n "$AAPT"
          "$AAPT" dump permissions "$APK" | tee /tmp/lana-star-permissions.txt
          if grep -Fq android.permission.INTERNET /tmp/lana-star-permissions.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: star-offline-verification
          path: |
            /tmp/lana-star/app/build/test-results/testDebugUnitTest/
            /tmp/lana-star-permissions.txt
