name: LANA response handling and model checks
on:
  push:
    branches: ['work/lana-dialogue-hardening']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate and test Android app
        run: |
          python android_recovery/prepare_recovery.py /tmp/lana-structured
          sed -i 's@mavenCentral()@maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }; mavenCentral()@g' /tmp/lana-structured/settings.gradle.kts
          base=/tmp/lana-structured/app
          sed -i '/applicationId =/a\        testInstrumentationRunner = "ai.dreibus.lanalive.LanaModelDialogueInstrumentation"' "$base/build.gradle.kts"
          mkdir -p "$base/src/androidTest/java/ai/dreibus/lanalive"
          cp android_integrated/verification/LanaModelDialogueInstrumentation.kt "$base/src/androidTest/java/ai/dreibus/lanalive/"
          gradle -p /tmp/lana-structured --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Download the pinned local model
        run: |
          curl -fLsS --retry 2 --max-time 200 'https://huggingface.co/litert-community/Qwen3-0.6B/resolve/e6687177e00897731e7716267eebd4eba0dde7c2/Qwen3-0.6B.litertlm' -o /tmp/Qwen3-0.6B.litertlm
          echo 'c5f39b4191926786c3e6668b62af4d6eb15248dfc7a5348252a9b406f33f2108  /tmp/Qwen3-0.6B.litertlm' | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: |
            adb install /tmp/lana-structured/app/build/outputs/apk/debug/app-debug.apk
            adb install /tmp/lana-structured/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell run-as ai.dreibus.lanalive.voicepreview mkdir -p files/lana-local-model
            adb shell -T 'run-as ai.dreibus.lanalive.voicepreview sh -c "cat > files/lana-local-model/Qwen3-0.6B.litertlm"' < /tmp/Qwen3-0.6B.litertlm
            adb shell am instrument -w ai.dreibus.lanalive.voicepreview.test/ai.dreibus.lanalive.LanaModelDialogueInstrumentation | tee /tmp/lana-instrumentation.txt
            grep -q LANA_REAL_MODEL_OK /tmp/lana-instrumentation.txt
