name: LANA GPT reliability candidate
on:
  push:
    branches: ['work/lana-gpt-reliability-20261128']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate GPT candidate from stable source
        run: |
          python android_speech/patch_v44.py LANA_V3_3_ANDROID_APP_SOURCE.zip /tmp/lana-gpt
          sed -i 's@mavenCentral()@maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }; mavenCentral()@g' /tmp/lana-gpt/settings.gradle.kts
          cmp android_team/src/LanaConversationRuntime.kt /tmp/lana-gpt/app/src/main/java/ai/dreibus/lanalive/LanaConversationRuntime.kt
      - name: Android unit tests and debug build (no signing or publication)
        working-directory: /tmp/lana-gpt
        run: gradle --no-daemon testDebugUnitTest assembleDebug
