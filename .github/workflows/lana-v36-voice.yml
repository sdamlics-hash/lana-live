name: LANA V3.6 Voice Reliability (native tests + emulator)
on:
  pull_request:
    paths:
      - 'android_voice/**'
      - '.github/workflows/lana-v36-voice.yml'
  workflow_dispatch:

jobs:
  native-tests-and-install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test voice patch generation and existing Android regression tests
        run: |
          python -m unittest discover -s android_bridge/tests -v
          python -m unittest discover -s android_voice/tests -v
          python android_voice/patch_v36.py LANA_V3_3_ANDROID_APP_SOURCE.zip /tmp/lana-v36
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kotlin JUnit + compile actual APK
        run: |
          cd /tmp/lana-v36
          gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open APK on emulated Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r /tmp/lana-v36/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n ai.dreibus.lanalive.voicepreview/ai.dreibus.lanalive.MainActivity
            sleep 7
            adb shell pidof ai.dreibus.lanalive.voicepreview | grep -Eq '[0-9]+'
            adb shell uiautomator dump /sdcard/lana-v36.xml
            adb shell cat /sdcard/lana-v36.xml | grep -F 'СЛУШАТЬ' >/dev/null
            echo 'V3.6 virtual Android launch and UI: PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: LANA-V3.6-VOICE-RELIABILITY-APK
          path: /tmp/lana-v36/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
