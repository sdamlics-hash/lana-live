name: LANA Core Tests
on:
  pull_request:
    paths:
      - 'lana_core/**'
      - 'tests/**'
      - '.github/workflows/lana-core-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test
        run: |
          python -m lana_core.cli --db /tmp/lana_demo.sqlite3 heartbeat
          python -m lana_core.cli --db /tmp/lana_demo.sqlite3 run-once
