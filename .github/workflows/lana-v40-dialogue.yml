name: LANA V4.0 Voice Turns
on:
  pull_request:
    paths:
      - 'android_workspace/**'
      - 'android_memory/**'
      - 'android_connections/**'
      - 'android_dialogue/**'
      - 'lana_core/**'
      - 'tests/**'
      - 'android_voice/**'
      - 'android_bridge/**'
      - 'LANA_V3_3_ANDROID_APP_SOURCE.zip'
      - '.github/workflows/lana-v40-dialogue.yml'
      - '.github/scripts/lana-v40-dialogue-smoke.py'
  workflow_dispatch:
concurrency:
  group: lana-v40-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate native workspace from preserved V3.3 archive
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s android_workspace/tests -v
          python -m unittest discover -s android_memory/tests -v
          python -m unittest discover -s android_connections/tests -v
          python -m unittest discover -s android_dialogue/tests -v
          python android_dialogue/patch_v40.py LANA_V3_3_ANDROID_APP_SOURCE.zip /tmp/lana-v40
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Native Kotlin tests and APK
        run: |
          cd /tmp/lana-v40
          gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real task and memory persistence on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python .github/scripts/lana-v40-dialogue-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: LANA-V4.0-VOICE-TURNS-APK
          path: /tmp/lana-v40/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
