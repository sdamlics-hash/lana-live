name: LANA APK update compatibility
on:
  pull_request:
    paths:
      - 'android_release/**'
      - '.github/workflows/lana-apk-update-check.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lana-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inspect-and-preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: LANA-V3.9-CONNECTIONS-APK
          run-id: 39617281734
          github-token: ${{ github.token }}
          path: /tmp/lana-release/baseline
      - uses: actions/download-artifact@v4
        with:
          name: LANA-V4.0-VOICE-TURNS-APK
          run-id: 39642156635
          github-token: ${{ github.token }}
          path: /tmp/lana-release/candidate
      - name: Verify actual APK signatures and release metadata
        run: |
          python -m unittest discover -s android_release/tests -v
          python android_release/check_apk_pair.py /tmp/lana-release/baseline/app-debug.apk /tmp/lana-release/candidate/app-debug.apk --output /tmp/lana-release/update-report.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test in-place update and record preservation without uninstall
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python android_release/update_smoke.py /tmp/lana-release/update-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LANA-APK-UPDATE-REPORT
          path: /tmp/lana-release/update-report.json
          if-no-files-found: warn
